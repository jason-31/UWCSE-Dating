# Production is deployed only by this workflow, only from main (docs/oversight.md rule 2). The
# Cloudflare token lives in the "production" environment, which only main may use, and nobody
# keeps a copy. Each run's log shows what was deployed (the Version ID printed by wrangler
# deploy), so the deployments in Cloudflare's audit log can be matched against these runs.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, in order.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the production environment
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the production environment (docs/deploy.md)."
            exit 1
          fi
      # Require the encryption and Google sign-in secrets before changing production.
      - name: Require Worker secrets
        run: |
          npx wrangler secret list --format json > "$RUNNER_TEMP/secrets.json"
          node -e '
            const names = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).map((s) => s.name);
            const missing = ["DATA_KEY", "GOOGLE_CLIENT_SECRET"].filter((name) => !names.includes(name));
            if (missing.length) {
              console.log(`::error::Missing Worker secrets: ${missing.join(", ")}. Run the matching provisioning workflow first.`);
              process.exit(1);
            }
          ' "$RUNNER_TEMP/secrets.json"
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply uwcse-date-db --remote
      - name: Deploy
        run: npx wrangler deploy
