# Puts the Google OAuth client secret on the Worker from the production environment's
# GOOGLE_CLIENT_SECRET, so that every change to the Worker's secrets comes from a public workflow
# run and none from the dashboard: in the audit log, a dashboard secret change looks the same as a
# dashboard code change. Run it by hand after creating the Worker (Provision DATA_KEY) and
# whenever the Google client secret is rotated.
name: Set Google client secret

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the production environment
        run: |
          if [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::Add GOOGLE_CLIENT_SECRET to the production environment's secrets (docs/deploy.md)."
            exit 1
          fi
      # printf, not echo: no trailing newline in the secret.
      - name: Put GOOGLE_CLIENT_SECRET
        run: printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET
